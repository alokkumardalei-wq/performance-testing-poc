# Demo databases for the end-to-end walkthrough: a PostgreSQL and a MongoDB,
# labeled the way percona operators label database pods so the plugin's
# anti-affinity and placement capture work identically to a real install.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-demo
  namespace: default
spec:
  serviceName: pg-demo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: pg-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pg-demo
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: demo-pg-pass
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pg-demo
  namespace: default
spec:
  selector:
    app.kubernetes.io/instance: pg-demo
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-demo
  namespace: default
spec:
  serviceName: mongo-demo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mongo-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mongo-demo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: demo-mongo-pass
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-demo
  namespace: default
spec:
  selector:
    app.kubernetes.io/instance: mongo-demo
  ports:
    - port: 27017
